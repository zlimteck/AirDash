name: AirDash

packages:
  FlagKit:
    url: https://github.com/madebybowtie/FlagKit.git
    from: "2.4.0"
  WireGuardKit:
    path: Vendor/wireguard-apple

options:
  bundleIdPrefix: com.airdash
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  useBaseInternationalization: false
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.airdash.ios
    MARKETING_VERSION: "1.0.14"
    CURRENT_PROJECT_VERSION: "14"
    INFOPLIST_FILE: AirDash/Supporting/Info.plist
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: targeted
    SWIFT_OBJC_BRIDGING_HEADER: AirDash/Supporting/SecurityBridging.h
    OTHER_SWIFT_FLAGS: ""

targets:
  AirDash:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AirDash
        excludes:
          - "**/.DS_Store"
          - "Supporting/*.plist"
          - "Supporting/*.entitlements"
    resources:
      - path: AirDash/Resources
    entitlements:
      path: AirDash/Supporting/AirDash.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.airdash.ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.airdash.ios
        com.apple.developer.networking.vpn.api:
          - allow-vpn
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: AirDash/Supporting/Info.plist
      properties:
        CFBundleDisplayName: AirDash
        CFBundleName: AirDash
        CFBundleIdentifier: com.airdash.ios
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSFaceIDUsageDescription: "AirDash uses Face ID to protect access to your VPN profiles."
        LSApplicationQueriesSchemes:
          - openvpn
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: true
        ITSEncryptionExportComplianceCode: 3b60dacc-5ae6-4380-b4d6-514eb5f8a7d5
        NSSupportsLiveActivities: true
    dependencies:
      - package: FlagKit
        product: FlagKit
      - target: AirDashWidget
        embed: true
      - target: AirDashTunnel
        embed: true
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Classic AppIcon-Light AppIcon-Purple AppIcon-Green AppIcon-Red AppIcon-Minimal AppIcon-MinimalDark"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) VPN_ENABLED"

  # Lite variant — no AirDashTunnel/WireGuardKit, no VPN entitlements.
  # Required for sideloading (AltStore/Sideloadly): those tools re-sign locally with the
  # end user's own free Apple account, which cannot carry the Personal VPN entitlement.
  # Shipping VPN entitlements in the main target would break install for every sideloaded
  # user, not just people building from source.
  AirDashLite:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AirDash
        excludes:
          - "**/.DS_Store"
          - "Supporting/*.plist"
          - "Supporting/*.entitlements"
    resources:
      - path: AirDash/Resources
    entitlements:
      path: AirDash/Supporting/AirDashLite.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.airdash.ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.airdash.ios
    info:
      path: AirDash/Supporting/Info-Lite.plist
      properties:
        CFBundleDisplayName: AirDash
        CFBundleName: AirDash
        CFBundleIdentifier: com.airdash.ios
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSFaceIDUsageDescription: "AirDash uses Face ID to protect access to your VPN profiles."
        LSApplicationQueriesSchemes:
          - openvpn
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: FlagKit
        product: FlagKit
      - target: AirDashWidget
        embed: true
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Classic AppIcon-Light AppIcon-Purple AppIcon-Green AppIcon-Red AppIcon-Minimal AppIcon-MinimalDark"

  AirDashWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AirDashWidget
      - path: AirDash/Models/VPNActivityAttributes.swift
        group: AirDashWidget
      - path: AirDash/Services/AppGroupID.swift
        group: AirDashWidget
    dependencies:
      - package: FlagKit
        product: FlagKit
    entitlements:
      path: AirDashWidget/AirDashWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.airdash.ios
    info:
      path: AirDashWidget/Info.plist
      properties:
        CFBundleDisplayName: AirDashWidget
        CFBundleIdentifier: com.airdash.ios.widget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.airdash.ios.widget
        SWIFT_STRICT_CONCURRENCY: targeted
        CODE_SIGN_STYLE: Automatic

  AirDashTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AirDashTunnel
      - path: AirDash/Models/AppError.swift
      - path: AirDash/Services/TunnelKeychainService.swift
      - path: AirDash/Services/AppGroupID.swift
      - path: Vendor/wireguard-apple/Sources/Shared/Model/TunnelConfiguration+WgQuickConfig.swift
        group: AirDashTunnel
      - path: Vendor/wireguard-apple/Sources/Shared/Model/String+ArrayConversion.swift
        group: AirDashTunnel
    dependencies:
      - target: WireGuardGoBridge
      - package: WireGuardKit
        product: WireGuardKit
    entitlements:
      path: AirDashTunnel/AirDashTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.airdash.ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.airdash.ios
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: AirDashTunnel/Info.plist
      properties:
        CFBundleDisplayName: AirDashTunnel
        CFBundleIdentifier: com.airdash.ios.tunnel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.airdash.ios.tunnel
        SWIFT_STRICT_CONCURRENCY: targeted
        CODE_SIGN_STYLE: Automatic
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Vendor/.build/wg-go/$(PLATFORM_NAME) $(inherited)"

aggregateTargets:
  WireGuardGoBridge:
    platform: iOS
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    buildScripts:
      - name: Build libwg-go.a
        script: |
          set -e
          # Xcode runs build script phases in a minimal shell that doesn't source
          # .zshrc/.bash_profile, so common Go install locations may be missing
          # from PATH even though they work fine in a normal terminal.
          export PATH="$PATH:/usr/local/go/bin:/opt/homebrew/bin:/usr/local/bin"
          # The vendored Makefile has no GOOS for the iOS Simulator, so Go falls back
          # to a plain darwin build whose runtime expects mach exception handlers that
          # only exist for GOOS=ios: the simulator link then fails with undefined
          # _darwin_arm_init_* symbols. Forcing GOOS=ios fixes it.
          make -C "$SRCROOT/Vendor/wireguard-apple/Sources/WireGuardKitGo" \
            GOOS_iphonesimulator=ios \
            DESTDIR="$SRCROOT/Vendor/.build/wg-go/$PLATFORM_NAME"
        outputFiles:
          - $(SRCROOT)/Vendor/.build/wg-go/$(PLATFORM_NAME)/libwg-go.a

schemes:
  AirDash:
    build:
      targets:
        AirDash: all
        AirDashWidget: [build]
        AirDashTunnel: [build]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AirDash-Lite:
    build:
      targets:
        AirDashLite: all
        AirDashWidget: [build]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
