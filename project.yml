name: AirDash

packages:
  FlagKit:
    url: https://github.com/madebybowtie/FlagKit.git
    from: "2.4.0"

options:
  bundleIdPrefix: com.airdash
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  useBaseInternationalization: false
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.airdash.ios
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "3"
    INFOPLIST_FILE: AirDash/Supporting/Info.plist
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: targeted
    OTHER_SWIFT_FLAGS: ""

targets:
  AirDash:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AirDash
        excludes:
          - "**/.DS_Store"
    resources:
      - path: AirDash/Resources
    entitlements:
      path: AirDash/Supporting/AirDash.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.airdash.ios
    info:
      path: AirDash/Supporting/Info.plist
      properties:
        CFBundleDisplayName: AirDash
        CFBundleName: AirDash
        CFBundleIdentifier: com.airdash.ios
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UILaunchScreen:
          UIImageName: ""
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - package: FlagKit
        product: FlagKit
      - target: AirDashWidget
        embed: true
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AirDashWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AirDashWidget
    entitlements:
      path: AirDashWidget/AirDashWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.airdash.ios
    info:
      path: AirDashWidget/Info.plist
      properties:
        CFBundleDisplayName: AirDashWidget
        CFBundleIdentifier: com.airdash.ios.widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.airdash.ios.widget
        SWIFT_STRICT_CONCURRENCY: targeted
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  AirDash:
    build:
      targets:
        AirDash: all
        AirDashWidget: [build]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
